# HTTPRoute for the goclaw gateway via Envoy Gateway — same pattern as the
# argocd example: HTTPRoute -> gateway.envoyproxy.io/Backend -> goclaw Service.
# Parent Gateway: default-envoy-gw in envoy-gateway-system.
#
# Apply after the goclaw Deployment/Service exist (04-goclaw.yaml).

# Backend (Envoy Gateway CRD) — upstream endpoints for the goclaw Service
# via its in-cluster DNS name.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: goclaw-backend
  namespace: goclaw
  labels:
    app.kubernetes.io/name: goclaw
spec:
  endpoints:
    - fqdn:
        hostname: goclaw.goclaw.svc.cluster.local
        port: 18790
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: goclaw-http
  namespace: goclaw
  labels:
    app.kubernetes.io/name: goclaw
spec:
  hostnames:
    - goclaw.172.19.0.2.nip.io
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: default-envoy-gw
      namespace: envoy-gateway-system
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: goclaw-backend
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
